name: QuantumOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Hoist signing secrets to job-level env vars so step if-conditions can use
      # env.VAR != '' checks — direct secrets.* references in step if-conditions
      # cause GitHub Actions' workflow parser to reject the workflow before any jobs run.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true   # a storage-quota hiccup here must not mask a green build/test
        with:
          name: quantumos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release build — only runs when the keystore secret is present.
      # Director: add KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD, and KEYSTORE_KEY_PASSWORD
      # as repository secrets (Settings → Secrets and variables → Actions) to activate these steps.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Write keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=quantumos-release\nkeyPassword=%s\n' \
            "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        if: env.KEYSTORE_BASE64 != ''
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true   # a storage-quota hiccup here must not mask a green build/test
        with:
          name: quantumos-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true   # a storage-quota hiccup here must not mask a green build/test
        with:
          name: unit-test-report
          path: app/build/reports/tests/
