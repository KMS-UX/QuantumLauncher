# Heap capped so the Gradle daemon doesn't get memory-killed on small Codespaces machines
# (the classic "daemon disappeared unexpectedly" crash). Comfortable on a 4-core / 8GB Codespace
# and on GitHub Actions runners alike.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
